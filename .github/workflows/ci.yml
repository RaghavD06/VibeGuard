name: VibeGuard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build monorepo workspaces
      run: npm run build
      
    - name: Run test suites (engine, scanners, verifier, 12-fixture harness)
      run: npm test
      
    - name: Run VibeGuard Policy Verification
      run: node packages/cli/dist/index.js scan . --ci --fail-on critical
