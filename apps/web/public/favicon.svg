<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#00E599" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M 50 6 C 58 12 71 14 88 16 C 90 49 84 74 50 94 C 16 74 10 49 12 16 C 29 14 42 12 50 6 Z"
        stroke="#3b4856" stroke-width="2.2" stroke-linejoin="round" fill="#0A0D12" />

  <!-- Inner Concentric Shield -->
  <path d="M 50 12.5 C 57 17.5 68 19 82 21 C 84 48 78 70 50 88 C 22 70 16 48 18 21 C 32 19 43 17.5 50 12.5 Z"
        stroke="#273240" stroke-width="1.8" stroke-linejoin="round" fill="none" />

  <!-- Radar Glow Disc -->
  <circle cx="50" cy="50" r="26.5" fill="url(#radar-glow)" />

  <!-- Radar Scope Ring -->
  <circle cx="50" cy="50" r="26.5" stroke="#00E599" stroke-width="2" filter="url(#glow)" stroke-opacity="0.95" />

  <!-- Radar Sweep Arm -->
  <line x1="50" y1="50" x2="68.7" y2="31.3" stroke="#00E599" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Origin Pivot -->
  <circle cx="50" cy="50" r="3.2" fill="#5EEAD4" filter="url(#glow)" />

  <!-- Perimeter Target Dot -->
  <circle cx="68.7" cy="31.3" r="3.2" fill="#5EEAD4" filter="url(#glow)" />
</svg>