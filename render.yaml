services:
  - type: web
    name: vibeguard-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: vibeguard-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
databases:
  - name: vibeguard-postgres
    plan: 0.1c-256mb
